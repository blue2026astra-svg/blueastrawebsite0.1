<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services - Blue Astra Technologies</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/services.css">
  <style>
    .service-section p,
    .service-section li,
    .service-section .service-caption,
    .service-card p {
      font-size:1.08rem;
      line-height:1.8;
      color:#1f1f1f;
      margin-bottom:1rem;
    }
    .service-section h2,
    .service-card h3 {
      margin-top:0;
      margin-bottom:1rem;
      color:var(--color-accent);
      letter-spacing:0.02em;
    }
    .service-section h2 {
      font-size:2rem;
    }
    .service-card h3 {
      font-size:1.25rem;
    }
    .service-two-col + p {
      margin-top:2rem;
    }
    .service-image {
      border-radius:16px;
      width:100%;
      height:auto;
      display:block;
      object-fit:cover;
      box-shadow:0 18px 40px rgba(0,0,0,0.12);
    }
    .service-two-col {
      display:flex;
      gap:1.5rem;
      flex-wrap:wrap;
      align-items:center;
      margin-top:1.5rem;
    }
    .service-two-col .col {
      flex:1 1 45%;
      min-width:260px;
    }
    .service-two-col .col p {
      border-left:4px solid #7DF9FF;
      padding-left:1rem;
      margin-left:0;
    }
    .service-three-col {
      display:flex;
      gap:1rem;
      flex-wrap:wrap;
      justify-content:center;
      margin-top:1.5rem;
    }
    .service-three-col .col {
      flex:1 1 calc(33.333% - 0.67rem);
      min-width:240px;
    }
    .service-three-col .service-caption {
      margin-top:1.5rem;
      font-size:1rem;
      color:#4a4a4a;
    }
  </style>
</head>
<body data-page="services">

  <div id="site-header"></div>

  <section class="hero">
    <h1>Contact Us</h1>
    <p>Have questions or want to learn more about our services? Get in touch with us!</p>
  </section>


  <!-- one large ass video being inserted here-->
<div class="section">
    <div class="service-three-col content-wrap">
      <div class="col">
        <img src="images/Workafella image.png" alt="Operations dashboard" class="service-image">
        <p class="service-caption">01, Infantry Road, Vasanth Nagar, Bangalore, Karnataka, India</p>
      </div>
      <div class="col">
        <img src="images/Map_Red_APAC.png" alt="Operations dashboard" class="service-image">
        </div>
      <div class="col">
        
        </div>
    </div>
  </div>
  <div id="site-footer"></div>

  <script src="js/components.js"></script>
</body>
</html>
